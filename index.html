<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2B211B" />
  <meta name="description" content="Willow helps you find the right words, gently." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Willow" />
  <title>Willow · the right words, gently</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://muhammadlailil.github.io/iconsax/style/outline.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <button class="brand-button" type="button" data-nav="reply" aria-label="Willow home">
      <svg class="brand-sprig" viewBox="0 0 64 80" aria-hidden="true">
        <path d="M31 73c6-15 6-31 5-47-.4-9 .2-15 3-22" fill="none" stroke="#6E8F63" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M36 18c9-8 18-8 22-4-5 8-13 11-22 10M33 31c-9-7-18-8-23-4 4 8 13 11 22 10M36 43c9-7 17-7 21-3-4 7-12 10-21 9M31 55c-8-7-16-8-21-4 4 7 12 10 20 9M34 64c8-6 15-6 19-2-4 6-11 8-18 8" fill="#B7CC9F"/>
      </svg>
      <span class="brand-copy"><strong>willow</strong></span>
    </button>
    <button class="icon-button" type="button" data-nav="settings" aria-label="Settings">
      <span class="isax icon-setting-2" aria-hidden="true"></span>
    </button>
  </header>

  <main class="app-main">
    <section class="screen active" id="screen-reply" aria-labelledby="replyTitle">
      <div class="page-wrap">
        <div class="page-heading">
          <h1 id="replyTitle">Reply</h1>
        </div>

        <section class="surface composer-card">
          <div class="segmented three" role="tablist" aria-label="Reply input type">
            <button class="active" type="button" data-reply-mode="screenshot">Screenshot</button>
            <button type="button" data-reply-mode="message">Message</button>
            <button type="button" data-reply-mode="context">Context</button>
          </div>

          <div class="reply-panel active" id="reply-panel-screenshot">
            <label class="upload-zone" for="screenshotInput">
              <input id="screenshotInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
              <div id="uploadEmpty" class="upload-empty">
                <span class="isax icon-gallery-add upload-icon" aria-hidden="true"></span>
                <strong>Upload screenshot</strong>
              </div>
              <div id="uploadPreview" class="upload-preview" hidden>
                <img id="previewImage" alt="Chat screenshot preview" />
                <div class="upload-preview-meta">
                  <span><strong id="previewName">Screenshot</strong><small id="previewSize"></small></span>
                  <button class="mini-button" type="button" id="removeScreenshot">Remove</button>
                </div>
              </div>
            </label>
            <label class="field-label" for="screenshotContext">Context <span>Optional</span></label>
            <textarea id="screenshotContext" rows="4" placeholder="Add context"></textarea>
          </div>

          <div class="reply-panel" id="reply-panel-message">
            <label class="field-label" for="messageInput">Paste the message</label>
            <textarea id="messageInput" rows="5" maxlength="4000" placeholder="Paste what they sent you..."></textarea>
            <label class="field-label" for="messageContext">Context <span>Optional</span></label>
            <textarea id="messageContext" rows="3" placeholder="What happened before this? Who is this person to you?"></textarea>
          </div>

          <div class="reply-panel" id="reply-panel-context">
            <label class="field-label" for="contextInput">Tell Willow what happened</label>
            <textarea id="contextInput" rows="6" placeholder="Explain the situation and what you want to say."></textarea>
          </div>

          <div class="intent-heading">
            <span>What are you trying to do?</span>
            <button id="intentToggle" type="button" class="text-button">More</button>
          </div>
          <div id="intentChips" class="reply-intents chip-wrap"></div>

          <button id="generateReplies" type="button" class="primary-button">Generate 5 replies</button>
        </section>

        <section id="replyResults" class="result-stack" aria-live="polite"></section>
      </div>
    </section>

    <section class="screen" id="screen-openers" aria-labelledby="openersTitle">
      <div class="page-wrap">
        <div class="page-heading">
          <h1 id="openersTitle">Openers</h1>
        </div>

        <section class="surface opener-controls">
          <label class="field-label">Person</label>
          <div id="openerAudienceChips" class="chip-wrap opener-audiences"></div>

          <label class="field-label">Category</label>
          <button id="openOpenerCategory" type="button" class="select-button">All</button>
        </section>

        <section id="openerFeature" class="surface feature-card opener-feature"></section>

        <div id="openerMore" class="result-stack compact"></div>

        <section class="surface fresh-card">
          <h2>Fresh set</h2>
          <div id="openerCounts" class="count-grid"></div>
          <button id="generateOpeners" type="button" class="primary-button">Generate openers</button>
        </section>
        <div id="openerResults" class="result-stack compact"></div>
      </div>
    </section>

    <section class="screen" id="screen-starters" aria-labelledby="startersTitle">
      <div class="page-wrap">
        <div class="page-heading">
          <h1 id="startersTitle">Starters</h1>
        </div>

        <div class="segmented two starter-tabs">
          <button class="active" type="button" data-starter-tab="browse">Browse</button>
          <button type="button" data-starter-tab="personalised">Personalised</button>
        </div>

        <div id="starterBrowse">
          <div id="quickCategories" class="horizontal-chips"></div>

          <section id="starterFeature" class="surface feature-card"></section>

          <div id="starterMore" class="result-stack compact"></div>

          <section class="surface fresh-card">
            <h2>Fresh set</h2>
            <div id="starterCounts" class="count-grid"></div>
            <button id="generateFresh" type="button" class="primary-button">Generate starters</button>
          </section>
          <div id="freshResults" class="result-stack compact"></div>
        </div>

        <div id="starterPersonalised" hidden>
          <section class="surface personalised-card">
            <label class="field-label">Person</label>
            <div id="relationshipChips" class="chip-wrap"></div>

            <label class="field-label">Category</label>
            <button id="openPersonalCategory" type="button" class="select-button">All topics</button>

            <label class="field-label">Vibe</label>
            <div id="vibeChips" class="chip-wrap"></div>

            <label class="field-label" for="personalContext">Context <span>Optional</span></label>
            <textarea id="personalContext" rows="4" placeholder="Add context"></textarea>

            <label class="field-label">Count</label>
            <div id="personalCounts" class="count-grid"></div>

            <button id="generatePersonalised" type="button" class="primary-button">Generate starters</button>
          </section>
          <div id="personalResults" class="result-stack compact"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-games" aria-labelledby="gamesTitle">
      <div class="page-wrap">
        <div class="page-heading">
          <h1 id="gamesTitle">Games</h1>
        </div>

        <div id="gameHome">
          <div id="gameGrid" class="game-grid"></div>
        </div>

        <div id="gameSetup" hidden>
          <section class="surface game-setup-card">
            <button id="backToGames" class="back-button" type="button"><span class="isax icon-arrow-left" aria-hidden="true"></span><span>Back to games</span></button>
            <span id="selectedGameLabel" class="eyebrow"></span>
            <h2>Players</h2>
            <div class="player-input-row">
              <input id="playerName" type="text" maxlength="24" placeholder="Player name" />
              <button id="addPlayer" type="button" class="secondary-button">Add</button>
            </div>
            <div id="playerChips" class="chip-wrap player-chips"></div>
            <button id="startGame" type="button" class="primary-button" disabled>Start game</button>
          </section>
        </div>

        <div id="gamePlay" hidden>
          <section class="surface game-play-card">
            <div class="turn-row"><span id="turnLabel" class="eyebrow"></span><span id="roundLabel" class="muted-copy"></span></div>
            <div id="truthDareChoice" class="truth-dare-choice" hidden>
              <button type="button" data-truth-dare="truth">Truth</button>
              <button type="button" data-truth-dare="dare">Dare</button>
            </div>
            <div id="gamePrompt" class="game-prompt"></div>
            <div class="game-actions">
              <button id="skipPrompt" type="button" class="secondary-button">Skip</button>
              <button id="nextTurn" type="button" class="primary-button">Next turn</button>
            </div>
          </section>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-history" aria-labelledby="historyTitle">
      <div class="page-wrap">
        <div class="page-heading with-action">
          <div><h1 id="historyTitle">History</h1></div>
          <button id="clearHistory" class="text-button danger" type="button">Clear</button>
        </div>
        <div id="historyList" class="result-stack compact"></div>
      </div>
    </section>

    <section class="screen" id="screen-settings" aria-labelledby="settingsTitle">
      <div class="page-wrap">
        <div class="page-heading">
          <h1 id="settingsTitle">Settings</h1>
        </div>

        <section class="surface settings-card">
          <label class="field-label">Appearance</label>
          <div class="segmented two">
            <button id="themeLight" type="button">Light</button>
            <button id="themeDark" type="button">Dark</button>
          </div>

          <label class="field-label" for="textingStyle">Your texting style</label>
          <textarea id="textingStyle" rows="5" placeholder="Short messages, Nigerian English, light Pidgin..."></textarea>
          <button id="saveSettings" type="button" class="primary-button">Save style</button>
        </section>

      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button class="active" type="button" data-nav="reply"><span class="isax icon-message-text" aria-hidden="true"></span><span>Reply</span></button>
    <button type="button" data-nav="openers"><span class="isax icon-message-add" aria-hidden="true"></span><span>Openers</span></button>
    <button type="button" data-nav="starters"><span class="isax icon-lamp-on" aria-hidden="true"></span><span>Starters</span></button>
    <button type="button" data-nav="games"><span class="isax icon-game" aria-hidden="true"></span><span>Games</span></button>
    <button type="button" data-nav="history"><span class="isax icon-clock" aria-hidden="true"></span><span>History</span></button>
    <button type="button" data-nav="settings"><span class="isax icon-setting-2" aria-hidden="true"></span><span>Settings</span></button>
  </nav>

  <div id="categoryBackdrop" class="sheet-backdrop" hidden></div>
  <section id="categorySheet" class="bottom-sheet" aria-modal="true" aria-labelledby="categoryTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2 id="categoryTitle">Conversation category</h2><button id="closeCategorySheet" class="icon-button" type="button" aria-label="Close"><span class="isax icon-close-circle" aria-hidden="true"></span></button></div>
    <h3 id="categorySectionTitle">Topics</h3>
    <div id="topicCategoryGrid" class="category-grid"></div>
    <div id="gameCategorySection">
      <h3>Games</h3>
      <div id="gameCategoryGrid" class="category-grid"></div>
    </div>
  </section>

  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="loading-card"><span class="spinner"></span><strong id="loadingText">Finding the right words...</strong></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" defer></script>
</body>
</html>
